name: API CI

on:
  push:
    branches:
      - main
      - api
  pull_request:
    branches:
      - main
      - api

jobs:
  test:
    name: Build and test API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: thehunter-rebirth-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate test JWT keys
        run: python3 scripts/generate-keys.py test

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: thehunter-rebirth-api/build/reports/tests/test/