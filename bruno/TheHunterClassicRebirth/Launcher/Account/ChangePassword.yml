info:
  name: ChangePassword
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/account/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "Password1!",
        "newPassword": "NewPassword2!"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Should return 204", function () {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
