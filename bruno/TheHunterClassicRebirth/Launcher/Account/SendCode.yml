info:
  name: SendCode
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/account/email-verification/send"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Should return 204", function () {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
