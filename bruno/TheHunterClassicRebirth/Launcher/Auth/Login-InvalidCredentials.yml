info:
  name: Login-InvalidCredentials
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "hunter@test.com",
        "password": "WrongPassword1!"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setEnvVar("accessToken", "");
        bru.setEnvVar("refreshToken", "");
    - type: tests
      code: |-
        test("Should return 401", function () {
          expect(res.status).to.equal(401);
        });

        test("Should return INVALID_CREDENTIALS", function () {
          expect(res.body.status).to.equal(401);
          expect(res.body.code).to.equal("INVALID_CREDENTIALS");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
