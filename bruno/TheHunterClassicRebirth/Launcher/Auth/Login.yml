info:
  name: Login
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "vanvooren.lucas@gmail.com",
        "password": "NewPassword2!"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setEnvVar("accessToken", "");
        bru.setEnvVar("refreshToken", "");
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("accessToken", res.body.accessToken);
          bru.setEnvVar("refreshToken", res.body.refreshToken);
        }
    - type: tests
      code: |-
        test("Should return 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Should return an access token", function () {
          expect(res.body.accessToken).to.be.a("string");
          expect(res.body.accessToken.length).to.be.greaterThan(0);
        });

        test("Should return a refresh token", function () {
          expect(res.body.refreshToken).to.be.a("string");
          expect(res.body.refreshToken.length).to.be.greaterThan(0);
        });

        test("Should return the authenticated user", function () {
          expect(res.body.user.email).to.equal("hunter@test.com");
        });

        test("Should return HUNTER role", function () {
          expect(res.body.user.roles).to.include("HUNTER");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
