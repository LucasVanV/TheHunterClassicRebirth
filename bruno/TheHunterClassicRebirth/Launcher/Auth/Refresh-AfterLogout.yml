info:
  name: Refresh-AfterLogout
  type: http
  seq: 10

http:
  method: POST
  url: POST {{baseUrl}}/api/auth/refresh
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{oldRefreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("oldRefreshToken", "");
    - type: tests
      code: |-
        test("Should return 401", function () {
          expect(res.status).to.equal(401);
        });

        test("Should return INVALID_REFRESH_TOKEN", function () {
          expect(res.body.status).to.equal(401);
          expect(res.body.code).to.equal("INVALID_REFRESH_TOKEN");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
