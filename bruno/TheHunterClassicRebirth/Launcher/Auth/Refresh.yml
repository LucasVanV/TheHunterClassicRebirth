info:
  name: Refresh
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setEnvVar("oldRefreshToken", bru.getEnvVar("refreshToken"));
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("accessToken", res.body.accessToken);
          bru.setEnvVar("refreshToken", res.body.refreshToken);
        }
    - type: tests
      code: |-
        test("Should return 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Should return a new access token", function () {
          expect(res.body.accessToken).to.be.a("string");
          expect(res.body.accessToken.length).to.be.greaterThan(0);
        });

        test("Should return a new refresh token", function () {
          expect(res.body.refreshToken).to.be.a("string");
          expect(res.body.refreshToken.length).to.be.greaterThan(0);
        });

        test("Should return the authenticated user", function () {
          expect(res.body.user.email).to.equal("hunter@test.com");
        });

        test("Should keep HUNTER role", function () {
          expect(res.body.user.roles).to.include("HUNTER");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
