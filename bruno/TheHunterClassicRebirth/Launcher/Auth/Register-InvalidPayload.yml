info:
  name: Register-InvalidPayload
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "invalid-email",
        "password": "abc"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setEnvVar("accessToken", "");
        bru.setEnvVar("refreshToken", "");
    - type: tests
      code: |-
        test("Should return 400", function () {
          expect(res.status).to.equal(400);
        });

        test("Should return VALIDATION_ERROR", function () {
          expect(res.body.status).to.equal(400);
          expect(res.body.code).to.equal("VALIDATION_ERROR");
        });

        test("Should return EMAIL_INVALID", function () {
          const error = res.body.errors.find(
            error => error.field === "email"
          );

          expect(error).to.exist;
          expect(error.code).to.equal("EMAIL_INVALID");
        });

        test("Should return PASSWORD_INVALID", function () {
          const error = res.body.errors.find(
            error => error.field === "password"
          );

          expect(error).to.exist;
          expect(error.code).to.equal("PASSWORD_INVALID");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
