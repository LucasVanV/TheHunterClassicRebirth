# =========================
# HTTP
# =========================
quarkus.http.host=${API_HOST}
quarkus.http.port=${API_PORT}


# =========================
# CORS
# =========================
quarkus.http.cors.enabled=${CORS_ENABLED}
quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=${CORS_METHODS}
quarkus.http.cors.headers=${CORS_HEADERS}
quarkus.http.cors.access-control-max-age=${CORS_ACCESS_CONTROL_MAX_AGE}


# =========================
# Datasource - PostgreSQL
# =========================
quarkus.datasource.db-kind=${DB_KIND}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}


# =========================
# Hibernate ORM
# =========================
quarkus.hibernate-orm.database.generation=${HIBERNATE_DATABASE_GENERATION}
quarkus.hibernate-orm.sql-load-script=${HIBERNATE_SQL_LOAD_SCRIPT}

quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL}
quarkus.log.category."org.hibernate.SQL".level=${HIBERNATE_SQL_LOG_LEVEL}
quarkus.log.category."org.hibernate.tool.schema".level=${HIBERNATE_SCHEMA_LOG_LEVEL}
quarkus.log.category."org.hibernate.orm.sql.exec".level=${HIBERNATE_SQL_EXEC_LOG_LEVEL}


# =========================
# Flyway
# =========================
quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START}
quarkus.flyway.validate-at-start=false
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED}


# =========================
# JWT
# =========================
jwt.issuer=${JWT_ISSUER}
mp.jwt.verify.issuer=${jwt.issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}


# =========================
# Launcher Authentication
# =========================
auth.launcher.access-token-duration=${LAUNCHER_ACCESS_TOKEN_DURATION}
auth.launcher.refresh-token-duration=${LAUNCHER_REFRESH_TOKEN_DURATION}


# =========================
# Email verification
# =========================
account.email-verification.code-duration=${EMAIL_VERIFICATION_CODE_DURATION}


# =========================
# Mailer
# =========================
quarkus.mailer.from=${MAIL_FROM}
quarkus.mailer.host=${MAIL_HOST}
quarkus.mailer.port=${MAIL_PORT}
quarkus.mailer.username=${MAIL_USERNAME}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.tls=${MAIL_TLS}
quarkus.mailer.start-tls=${MAIL_START_TLS}
quarkus.mailer.login=${MAIL_LOGIN}
quarkus.mailer.mock=${MAIL_MOCK}


# =========================
# OpenAPI
# =========================
quarkus.swagger-ui.always-include=${SWAGGER_UI}
quarkus.smallrye-openapi.path=${OPENAPI_PATH}

quarkus.smallrye-openapi.info-title=${OPENAPI_TITLE}
quarkus.smallrye-openapi.info-version=${OPENAPI_VERSION}
quarkus.smallrye-openapi.info-description=${OPENAPI_DESCRIPTION}


# =========================
# Logs
# =========================
quarkus.log.level=${QUARKUS_LOG_LEVEL}