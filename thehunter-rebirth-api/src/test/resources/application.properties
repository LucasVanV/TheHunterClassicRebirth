# =========================
# HTTP
# =========================
quarkus.http.host=localhost
quarkus.http.port=0
quarkus.http.test-port=0


# =========================
# CORS
# =========================
quarkus.http.cors.enabled=false


# =========================
# Datasource - H2
# =========================
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:thehunter_rebirth_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1

quarkus.datasource.devservices.enabled=false


# =========================
# Hibernate ORM
# =========================
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.sql-load-script=no-file

quarkus.hibernate-orm.log.sql=false
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.category."org.hibernate.tool.schema".level=WARN
quarkus.log.category."org.hibernate.orm.sql.exec".level=WARN


# =========================
# Flyway
# =========================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-at-start=false
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=false


# =========================
# JWT
# =========================
jwt.issuer=thehunter-classic-rebirth-test
mp.jwt.verify.issuer=${jwt.issuer}
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem


# =========================
# Launcher Authentication
# =========================
auth.launcher.access-token-duration=PT15M
auth.launcher.refresh-token-duration=P30D


# =========================
# Email verification
# =========================
account.email-verification.code-duration=PT15M


# =========================
# Mailer
# =========================
quarkus.mailer.from=test@thehunter-rebirth.local
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.username=test
quarkus.mailer.password=test
quarkus.mailer.tls=false
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.login=DISABLED
quarkus.mailer.mock=true


# =========================
# OpenAPI
# =========================
quarkus.swagger-ui.always-include=false
quarkus.smallrye-openapi.path=/q/openapi

quarkus.smallrye-openapi.info-title=TheHunterClassicRebirth Test API
quarkus.smallrye-openapi.info-version=test
quarkus.smallrye-openapi.info-description=Test environment


# =========================
# Logs
# =========================
quarkus.log.level=WARN
quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG
quarkus.log.category."io.smallrye.jwt".level=DEBUG
quarkus.log.category."io.quarkus.security".level=DEBUG